name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: verify proxy-agents dist files (Gate 2)
        run: |
          node -e "
          const fs = require('fs');
          const pkgs = ['http-proxy-agent', 'agent-base', 'https-proxy-agent'];
          const missing = pkgs.filter((p) => !fs.existsSync('node_modules/' + p + '/dist/index.js'));
          if (missing.length) { console.error('MISSING dist/index.js:', missing); process.exit(1); }
          console.log('proxy-agents dist OK:', pkgs.join(', '));
          "

      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build
