services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vision_qc
      POSTGRES_USER: vision_qc
      POSTGRES_PASSWORD: vision_qc
    ports:
      # host 5433 -> container 5432; host 5432 is occupied by the native
      # Windows PostgreSQL instance, which is intentionally left running.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_qc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
